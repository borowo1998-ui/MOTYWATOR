name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Znajdz projekt i przygotuj
        id: prep
        run: |
          echo "Szukam projektu..."
          # Rozpakuj ZIPy jesli sa
          for f in *.zip; do [ -f "$f" ] && unzip -o "$f" || true; done
          for f in */*.zip; do [ -f "$f" ] && unzip -o "$f" || true; done
          
          # Znajdz gdzie jest settings.gradle.kts
          ROOT=$(find . -name "settings.gradle.kts" -type f | head -1 | xargs dirname 2>/dev/null)
